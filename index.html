        this.init();
        return JSON.parse(localStorage.getItem('enblox_db_packages') || '[]');

        localStorage.setItem('enblox_db_packages', JSON.stringify(pkgs));
      },
      getTransactions() {
        this.init();
        return JSON.parse(localStorage.getItem('enblox_db_transactions') || '[]');
      },
      addTransaction(txn) {
        const txns = this.getTransactions();
        const newTxn = { id: 'txn_' + Date.now(), date: new Date().toLocaleString('th-TH'), status: 'SUCCESS', ...txn };
        txns.unshift(newTxn);
        localStorage.setItem('enblox_db_transactions', JSON.stringify(txns));
        return newTxn;
      },
      getAdminCredentials() {
        this.init();
        return JSON.parse(localStorage.getItem('enblox_db_admin'));
      },
      updateAdminCredentials(username, password) {
        localStorage.setItem('enblox_db_admin', JSON.stringify({ username, password }));
      },
      getReadings() {
        this.init();
        return JSON.parse(localStorage.getItem('enblox_tarot_history') || '[]');

                  <button 
                    onClick={() => setAdminTab('settings')}
                    className={`px-4 py-2 rounded-xl text-xs font-medium transition-all ${adminTab === 'settings' ? 'bg-slate-900 text-white shadow-md' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50'}`}
                  >
                    ตั้งค่าบัญชี Admin
                  </button>
                </div>

                {/* Tab 1: Transactions */}
                {adminTab === 'transactions' && (
                  <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
                    <h3 className="text-base font-bold text-slate-900 mb-4">รายการชำระเงินผ่าน PromptPay ทั้งหมดในระบบฐานข้อมูล</h3>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs text-slate-600">
                        <thead className="bg-slate-50 border-b border-slate-200 text-slate-700 font-semibold uppercase">
                          <tr>
                            <th className="p-3">Transaction ID</th>
                            <th className="p-3">แพ็กเกจ</th>
                            <th className="p-3">ยอดเงิน (THB)</th>
                            <th className="p-3">วันที่ทำรายการ</th>
                            <th className="p-3">สถานะ</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {transactionsList.map((txn, idx) => (
                            <tr key={idx} className="hover:bg-slate-50">
                              <td className="p-3 font-mono text-slate-500">{txn.id}</td>
                              <td className="p-3 font-medium text-slate-900">{txn.packageName}</td>
                              <td className="p-3 font-bold font-cinzel text-slate-900">฿{txn.price}</td>
                              <td className="p-3">{txn.date}</td>
                              <td className="p-3">
                                <span className="px-2 py-1 rounded-full bg-emerald-100 text-emerald-800 font-semibold text-[10px]">
                                  {txn.status}
                                </span>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* Tab 2: Packages Management */}
                {adminTab === 'packages' && (
                  <div className="space-y-6">
                    <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
                      <h3 className="text-base font-bold text-slate-900 mb-2">แก้ไขข้อมูลแพ็กเกจและราคาในระบบฐานข้อมูล</h3>
                      <p className="text-xs text-slate-500 mb-6">การแก้ไขที่นี่จะแสดงผลทันทีบนหน้าแรกของเว็บไซต์โดยไม่ต้องแก้โค้ด Frontend</p>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {packages.map((pkg, idx) => (
                          <div key={pkg.id} className="p-5 rounded-2xl border border-slate-200 bg-slate-50 flex flex-col justify-between">
                            <div>
                              <div className="flex justify-between items-center mb-3">
                                <span className="text-[10px] font-mono bg-slate-200 px-2 py-0.5 rounded text-slate-700">ID: {pkg.id}</span>
                                <span className="text-[10px] font-semibold text-amber-700 bg-amber-50 px-2 py-0.5 rounded">{pkg.cardCount} ใบ</span>
                              </div>
                              <label className="block text-[11px] font-medium text-slate-700 mb-1">ชื่อแพ็กเกจ:</label>
                              <input 
                                type="text"
                                value={pkg.name}
                                onChange={(e) => {
                                  const updated = [...packages];
                                  updated[idx].name = e.target.value;
                                  setPackages(updated);
                                  DatabaseServer.savePackages(updated);
                                }}
                                className="w-full bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs mb-3"
                              />

                              <label className="block text-[11px] font-medium text-slate-700 mb-1">ราคา (บาท):</label>
                              <input 
                                type="text"
                                value={pkg.price}
                                onChange={(e) => {
                                  const updated = [...packages];
                                  updated[idx].price = e.target.value;
                                  setPackages(updated);
                                  DatabaseServer.savePackages(updated);
                                }}
                                className="w-full bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs mb-3 font-cinzel font-bold"
                              />
                            </div>

                            <div className="text-[10px] text-emerald-600 font-medium bg-emerald-50 p-2 rounded-lg text-center mt-2">
                              ✓ บันทึกอัตโนมัติลง Database แล้ว
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* Tab 3: Admin Settings */}
                {adminTab === 'settings' && (
                  <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm max-w-lg">
                    <h3 className="text-base font-bold text-slate-900 mb-2">เปลี่ยนรหัสผ่านผู้ดูแลระบบ (Admin Account Settings)</h3>
                    <p className="text-xs text-slate-500 mb-6">อัปเดตบัญชีผู้ใช้และรหัสผ่านสำหรับเข้าสู่ระบบ Admin</p>

                    <form onSubmit={(e) => {
                      e.preventDefault();
                      const newU = e.target.elements.new_user.value;
                      const newP = e.target.elements.new_pass.value;
                      if (!newU || !newP) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');
                      DatabaseServer.updateAdminCredentials(newU, newP);
                      alert('บันทึกรหัสผ่าน Admin ใหม่เรียบร้อยแล้ว');
                    }} className="space-y-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-700 mb-1">Username ใหม่:</label>
                        <input 
                          name="new_user"
                          type="text"
                          defaultValue={DatabaseServer.getAdminCredentials().username}
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-slate-700 mb-1">Password ใหม่:</label>
                        <input 
                          name="new_pass"
                          type="password"
                          placeholder="กรอกรหัสผ่านใหม่"
                          className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-xs"
                        />
                      </div>
                      <button 
                        type="submit"
                        className="px-6 py-2.5 rounded-full bg-slate-900 text-white text-xs font-medium hover:bg-slate-800 transition-all"
                      >
                        บันทึกการเปลี่ยนแปลงรหัสผ่าน
                      </button>
                    </form>
                  </div>
                )}

              </div>
            )}

          </main>

          {/* PAYMENT MODAL */}
          {isPaymentModalOpen && selectedPackage && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="w-full max-w-md rounded-3xl bg-white border border-slate-200 p-6 sm:p-8 shadow-2xl relative">
                
                <button 
                  onClick={() => setIsPaymentModalOpen(false)}
                  className="absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500 hover:text-slate-900 transition-all"
                >
                  <IconClose className="w-4 h-4" />
                </button>

                <div className="text-center mb-6">
                  <div className="w-12 h-12 rounded-2xl bg-slate-100 text-slate-900 flex items-center justify-center mx-auto mb-3">
                    <IconQrCode className="w-6 h-6" />
                  </div>
                  <h3 className="text-xl font-bold text-slate-900">ชำระเงินผ่าน PromptPay</h3>
                  <p className="text-xs text-slate-500 mt-1">สแกน QR Code เพื่อปลดล็อกห้องทำนายดวงชะตาทันที</p>
                </div>

                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 mb-6">
                  <div className="flex justify-between items-center text-xs text-slate-500 mb-1.5">
                    <span>แพ็กเกจ:</span>
                    <span className="text-slate-900 font-medium">{selectedPackage.name}</span>
                  </div>
                  <div className="flex justify-between items-center text-xs text-slate-500 mb-2">
                    <span>จำนวนไพ่ที่ทำนาย:</span>
                    <span className="text-slate-900 font-medium">{selectedPackage.cardCount} ใบ</span>
                  </div>
                  <div className="flex justify-between items-center text-sm font-bold text-slate-900 pt-2 border-t border-slate-200">
                    <span>ยอดชำระสุทธิ:</span>
                    <span className="text-slate-900 font-cinzel text-lg">฿{selectedPackage.price}</span>
                  </div>
                </div>

                <div className="p-4 rounded-2xl bg-white border border-slate-200 flex flex-col items-center justify-center mb-6 shadow-sm">
                  <img 
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PROMPTPAY_ENBLOX_${selectedPackage.id}_${selectedPackage.price}`} 
                    alt="PromptPay QR Code" 
                    className="w-40 h-40 object-contain mb-2"
                  />
                  <span className="text-[10px] text-slate-600 font-medium tracking-wider uppercase">
                    พร้อมเพย์ (PromptPay E-Wallet)
                  </span>
                </div>

                <button 
                  onClick={handleConfirmPayment}
                  className="w-full py-3.5 rounded-full bg-slate-900 text-white font-medium text-xs uppercase tracking-wider hover:bg-slate-800 shadow-md transition-all flex items-center justify-center gap-2"
                >
                  <IconCheck className="w-4 h-4" />
                  <span>ยืนยันการชำระเงินและเริ่มดูดวง</span>
                </button>

                <p className="text-center text-[10px] text-slate-500 mt-3 font-light">
                  ระบบจะบันทึกธุรกรรมลงฐานข้อมูลและพาคุณเข้าสู่ห้องพิธีทันที
                </p>

              </div>
            </div>
          )}

          {/* ADMIN LOGIN MODAL */}
          {isAdminModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="w-full max-w-sm rounded-3xl bg-white border border-slate-200 p-6 sm:p-8 shadow-2xl relative">
                
                <button 
                  onClick={() => setIsAdminModalOpen(false)}
                  className="absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500 hover:text-slate-900 transition-all"
                >
                  <IconClose className="w-4 h-4" />
                </button>

                <div className="text-center mb-6">
                  <div className="w-12 h-12 rounded-2xl bg-amber-50 text-amber-700 flex items-center justify-center mx-auto mb-3">
                    <IconLock className="w-6 h-6" />
                  </div>
                  <h3 className="text-xl font-bold text-slate-900">Admin Login</h3>
                  <p className="text-xs text-slate-500 mt-1">เข้าสู่ระบบผู้ดูแลระบบ (Default: admin / password123)</p>
                </div>

                {adminLoginError && (
                  <div className="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-600 text-center">
                    {adminLoginError}
                  </div>
                )}

                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-700 mb-1">Username:</label>
                    <input 
                      type="text"
                      value={adminUser}
                      onChange={(e) => setAdminUser(e.target.value)}
                      placeholder="admin"
                      required
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-slate-900"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-700 mb-1">Password:</label>
                    <input 
                      type="password"
                      value={adminPass}
                      onChange={(e) => setAdminPass(e.target.value)}
                      placeholder="••••••••"
                      required
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-slate-900"
                    />
                  </div>

                  <button 
                    type="submit"
                    className="w-full py-3 rounded-full bg-slate-900 text-white font-medium text-xs uppercase tracking-wider hover:bg-slate-800 shadow-md transition-all flex items-center justify-center gap-2 mt-2"
                  >
                    <span>เข้าสู่ระบบ Admin</span>
                  </button>
                </form>

              </div>
            </div>
          )}

          <footer className="relative z-20 border-t border-slate-200 bg-white py-8 px-6 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-cinzel text-slate-900 font-semibold tracking-wider">MANIFEST TAROT</span>
                <span>• © 2026 สงวนลิขสิทธิ์ทุกประการ</span>
              </div>
              <p className="text-slate-500 font-light">
                ไพ่ทาโรต์เป็นศาสตร์แห่งการสะท้อนสภาวะจิตใจและแนวทางเชิงบวก
              </p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
